<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScamLens - Explainable, Multilingual Scam Detection</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-0 sm:p-6">

    <!-- Mobile Phone Frame Mockup -->
    <div class="w-full max-w-sm bg-slate-900 sm:rounded-[40px] shadow-2xl border-4 border-slate-800 overflow-hidden flex flex-col h-[100vh] sm:h-[840px] relative">
        
        <!-- Status Bar -->
        <div class="bg-slate-900/90 px-6 py-3 flex justify-between items-center text-xs font-semibold text-slate-400 border-b border-slate-800/60 z-20">
            <span>9:41</span>
            <div class="flex items-center space-x-2">
                <span class="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded text-blue-400 font-mono">5G</span>
                <div class="w-4 h-2.5 border border-slate-400 rounded-sm p-0.5 flex items-center">
                    <div class="h-full w-full bg-slate-400 rounded-2xs"></div>
                </div>
            </div>
        </div>

        <!-- APP CONTAINER (Dynamic Views) -->
        <div id="app-view" class="flex-1 overflow-y-auto p-5 space-y-5">
            <!-- Injected dynamically via JavaScript -->
        </div>

        <!-- Bottom Navigation Bar -->
        <nav id="bottom-nav" class="bg-slate-900 border-t border-slate-800 grid grid-cols-3 text-center py-3 text-xs z-20">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center space-y-1 text-blue-400 font-semibold">
                <span class="text-base">🔍</span>
                <span>Home</span>
            </button>
            <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center space-y-1 text-slate-400">
                <span class="text-base">📜</span>
                <span>History</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center space-y-1 text-slate-400">
                <span class="text-base">⚙️</span>
                <span>Settings</span>
            </button>
        </nav>
    </div>

    <script>
        // App State
        let currentScreen = 'welcome'; 
        let currentLang = 'English';
        let activeTab = 'home';
        let scanResultType = 'high'; 

        // Render Engine
        function render() {
            const container = document.getElementById('app-view');
            const nav = document.getElementById('bottom-nav');
            
            if (currentScreen === 'welcome' || currentScreen === 'analyzing') {
                nav.style.display = 'none';
            } else {
                nav.style.display = 'grid';
            }

            if (currentScreen === 'welcome') {
                container.innerHTML = `
                    <div class="flex flex-col justify-between h-full py-10 text-center">
                        <div class="space-y-6 pt-10">
                            <div class="w-20 h-20 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-3xl mx-auto flex items-center justify-center text-3xl font-bold text-white shadow-xl shadow-blue-500/30">
                                S
                            </div>
                            <div class="space-y-2">
                                <h1 class="text-2xl font-bold tracking-tight text-white">ScamLens</h1>
                                <p class="text-xs text-slate-400 max-w-[240px] mx-auto leading-relaxed">
                                    Detect scams. Understand risks. Stay safe[cite: 5].
                                </p>
                            </div>
                            <div class="flex justify-center space-x-3 pt-4">
                                <span class="px-3 py-1 bg-slate-800 border border-slate-700 rounded-full text-[11px] text-slate-300">SMS</span>
                                <span class="px-3 py-1 bg-slate-800 border border-slate-700 rounded-full text-[11px] text-slate-300">WhatsApp</span>
                                <span class="px-3 py-1 bg-slate-800 border border-slate-700 rounded-full text-[11px] text-slate-300">Gmail</span>
                            </div>
                        </div>
                        <div class="space-y-3">
                            <button onclick="goToHome()" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded-2xl font-semibold text-sm text-white shadow-lg shadow-blue-600/30 transition active:scale-98">
                                Get Started →
                            </button>
                            <p class="text-[10px] text-slate-500">Privacy-First: Only shared content is analyzed[cite: 6].</p>
                        </div>
                    </div>
                `;
            } 
            else if (currentScreen === 'home') {
                activeTab = 'home';
                updateNavActive();
                container.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white text-sm">S</div>
                            <span class="font-bold text-lg">ScamLens</span>
                        </div>
                        <select onchange="currentLang = this.value" class="bg-slate-800 text-xs text-slate-200 border border-slate-700 rounded-lg px-2 py-1 focus:outline-none">
                            <option ${currentLang==='English'?'selected':''}>English</option>
                            <option ${currentLang==='Tamil'?'selected':''}>Tamil (தமிழ்)</option>
                            <option ${currentLang==='Tanglish'?'selected':''}>Tanglish</option>
                            <option ${currentLang==='Hindi'?'selected':''}>Hindi (हिन्दी)</option>
                            <option ${currentLang==='Hinglish'?'selected':''}>Hinglish</option>
                        </select>
                    </div>

                    <div class="bg-gradient-to-br from-blue-900/40 to-slate-800 border border-blue-800/50 rounded-2xl p-4 space-y-3">
                        <h2 class="text-xs font-bold uppercase tracking-wider text-blue-400">Scan Messages, Links & More[cite: 5]</h2>
                        <p class="text-xs text-slate-300">Paste a message, share from WhatsApp/Gmail, or enter a URL[cite: 5].</p>
                        
                        <div class="grid grid-cols-3 gap-2 pt-1">
                            <button onclick="triggerAnalysis('high')" class="p-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-center text-xs font-medium text-slate-200 transition">
                                💬 Paste Message
                            </button>
                            <button onclick="triggerAnalysis('high')" class="p-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-center text-xs font-medium text-slate-200 transition">
                                🔗 Scan Link
                            </button>
                            <button onclick="triggerAnalysis('safe')" class="p-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-center text-xs font-medium text-slate-200 transition">
                                📱 Share Apps
                            </button>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Recent Scans[cite: 5]</h3>
                        
                        <div onclick="triggerAnalysis('high')" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 rounded-xl p-3.5 flex items-center justify-between cursor-pointer transition">
                            <div class="flex items-center space-x-3">
                                <div class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></div>
                                <div>
                                    <p class="text-xs font-medium text-slate-200">Bank KYC message[cite: 5]</p>
                                    <p class="text-[10px] text-slate-500">2 min ago[cite: 5]</p>
                                </div>
                            </div>
                            <span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-red-500/20 text-red-400 border border-red-500/30">High Risk[cite: 5]</span>
                        </div>

                        <div onclick="triggerAnalysis('safe')" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 rounded-xl p-3.5 flex items-center justify-between cursor-pointer transition">
                            <div class="flex items-center space-x-3">
                                <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                                <div>
                                    <p class="text-xs font-medium text-slate-200">Gmail message[cite: 5]</p>
                                    <p class="text-[10px] text-slate-500">1 hr ago[cite: 5]</p>
                                </div>
                            </div>
                            <span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Safe[cite: 5]</span>
                        </div>
                    </div>
                `;
            }
            else if (currentScreen === 'analyzing') {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full space-y-6 text-center py-20">
                        <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                        <div class="space-y-2">
                            <h2 class="text-base font-bold text-white">Analyzing your message...[cite: 5]</h2>
                            <p class="text-xs text-slate-400">Detecting language • Checking scam patterns • Analyzing links[cite: 5]</p>
                        </div>
                    </div>
                `;
            }
            else if (currentScreen === 'result') {
                if (scanResultType === 'high') {
                    const isTamil = currentLang === 'Tamil (தமிழ்)' || currentLang === 'Tanglish';
                    container.innerHTML = `
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <span class="px-3 py-1 bg-red-500/20 border border-red-500/40 text-red-400 text-xs font-bold rounded-full uppercase tracking-wider">
                                    ${isTamil ? 'மோசடி வாய்ப்பு உள்ளது (High Risk)' : 'High Risk Detected'}[cite: 5]
                                </span>
                                <button onclick="currentScreen='home'; render();" class="text-xs text-blue-400 underline">← Back</button>
                            </div>

                            <div class="bg-slate-800 border border-red-500/40 rounded-2xl p-4 space-y-3">
                                <h4 class="text-[11px] font-semibold text-slate-400 uppercase">Message Analyzed:</h4>
                                <div class="bg-slate-900 p-3 rounded-xl text-xs text-slate-300 italic border border-slate-700">
                                    "${isTamil ? 'Ungal bank account block aagum. Indha link-la KYC update pannunga. https://kyc-update.in' : 'Your bank account will be blocked today. Update your KYC Immediately using this link: https://bank-update.com'}"[cite: 5]
                                </div>

                                <h4 class="text-[11px] font-semibold text-red-400 uppercase pt-2">Why this is suspicious?[cite: 5]</h4>
                                <ul class="space-y-1.5 text-xs text-slate-200">
                                    <li class="flex items-start space-x-2"><span class="text-red-400 font-bold">•</span><span>${isTamil ? 'அவசரப்படுத்தும் மொழி ("block aagum")' : 'Creates urgency ("blocked today")'}[cite: 5]</span></li>
                                    <li class="flex items-start space-x-2"><span class="text-red-400 font-bold">•</span><span>${isTamil ? 'KYC புதுப்பிக்கச் சொல்கிறது' : 'Requests immediate KYC update'}[cite: 5]</span></li>
                                    <li class="flex items-start space-x-2"><span class="text-red-400 font-bold">•</span><span>${isTamil ? 'சந்தேகமான இணைப்பு (kyc-update.in)' : 'Contains suspicious unverified link'}[cite: 5]</span></li>
                                </ul>

                                <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-700/80 mt-3">
                                    <h4 class="text-[11px] font-semibold text-emerald-400 uppercase mb-1">Recommended Action:[cite: 5]</h4>
                                    <p class="text-xs text-slate-200 leading-relaxed">
                                        ${isTamil ? 'இணைப்பைக் கிளிக் செய்ய வேண்டாம். உங்கள் வங்கியின் அதிகாரப்பூர்வ செயலி மூலம் மட்டும் சரிபார்க்கவும்.' : 'Do not click the link. Verify your account through your bank\'s official app or website.'}[cite: 5]
                                    </p>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-3 pt-2">
                                <button onclick="currentScreen='home'; render();" class="py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-semibold text-slate-200">Scan Another[cite: 5]</button>
                                <button onclick="alert('Result shared securely!')" class="py-2.5 bg-blue-600 hover:bg-blue-500 rounded-xl text-xs font-semibold text-white shadow-lg shadow-blue-600/30">Share Result[cite: 5]</button>
                            </div>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <span class="px-3 py-1 bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 text-xs font-bold rounded-full uppercase tracking-wider">
                                    Safe - No Scam Detected[cite: 6]
                                </span>
                                <button onclick="currentScreen='home'; render();" class="text-xs text-blue-400 underline">← Back</button>
                            </div>

                            <div class="bg-slate-800 border border-emerald-500/40 rounded-2xl p-4 space-y-3">
                                <h4 class="text-[11px] font-semibold text-slate-400 uppercase">Message Analyzed:</h4>
                                <div class="bg-slate-900 p-3 rounded-xl text-xs text-slate-300 italic border border-slate-700">
                                    "Your monthly bank statement is available. Please check it through your official banking app."[cite: 6]
                                </div>

                                <h4 class="text-[11px] font-semibold text-emerald-400 uppercase pt-2">Why this is safe?[cite: 6]</h4>
                                <ul class="space-y-1.5 text-xs text-slate-200">
                                    <li class="flex items-start space-x-2"><span class="text-emerald-400">✓</span><span>Comes from an official bank domain[cite: 6]</span></li>
                                    <li class="flex items-start space-x-2"><span class="text-emerald-400">✓</span><span>No urgent or threatening language[cite: 6]</span></li>
                                    <li class="flex items-start space-x-2"><span class="text-emerald-400">✓</span><span>No suspicious links[cite: 6]</span></li>
                                </ul>
                            </div>

                            <div class="grid grid-cols-2 gap-3 pt-2">
                                <button onclick="currentScreen='home'; render();" class="py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-semibold text-slate-200">Scan Another[cite: 6]</button>
                                <button onclick="alert('Result shared securely!')" class="py-2.5 bg-blue-600 hover:bg-blue-500 rounded-xl text-xs font-semibold text-white shadow-lg shadow-blue-600/30">Share Result[cite: 6]</button>
                            </div>
                        </div>
                    `;
                }
            }
            else if (currentScreen === 'history') {
                activeTab = 'history';
                updateNavActive();
                container.innerHTML = `
                    <div class="space-y-4">
                        <h2 class="text-sm font-bold text-white">Scan History[cite: 6]</h2>
                        <div class="space-y-2">
                            <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex justify-between items-center">
                                <div><p class="text-xs font-medium">Bank KYC message[cite: 6]</p><p class="text-[10px] text-slate-500">Today 2:14 PM[cite: 6]</p></div>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-red-500/20 text-red-400">High Risk[cite: 6]</span>
                            </div>
                            <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex justify-between items-center">
                                <div><p class="text-xs font-medium">Delivery notification[cite: 6]</p><p class="text-[10px] text-slate-500">Yesterday 4:22 PM[cite: 6]</p></div>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-400">Medium</span>
                            </div>
                            <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex justify-between items-center">
                                <div><p class="text-xs font-medium">Gmail message[cite: 6]</p><p class="text-[10px] text-slate-500">Today 8:00 AM[cite: 6]</p></div>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400">Safe[cite: 6]</span>
                            </div>
                        </div>
                    </div>
                `;
            }
            else if (currentScreen === 'settings') {
                activeTab = 'settings';
                updateNavActive();
                container.innerHTML = `
                    <div class="space-y-4">
                        <h2 class="text-sm font-bold text-white">Settings[cite: 6]</h2>
                        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-3 text-xs">
                            <div class="flex justify-between border-b border-slate-700 pb-2">
                                <span>Language</span>
                                <span class="text-blue-400 font-semibold">${currentLang}</span>
                            </div>
                            <div class="flex justify-between border-b border-slate-700 pb-2">
                                <span>Privacy & Security</span>
                                <span class="text-emerald-400 font-semibold">Protected</span>
                            </div>
                            <div class="flex justify-between">
                                <span>No access to UPI PINs / OTPs</span>
                                <span class="text-slate-400">Verified[cite: 6]</span>
                            </div>
                        </div>
                        <div class="bg-blue-950/40 border border-blue-800/60 rounded-xl p-3 text-[11px] text-blue-300">
                            🛡️ <strong>Privacy First:</strong> Only shared content is analyzed. No background scraping or direct inbox reading without user consent[cite: 6].
                        </div>
                    </div>
                `;
            }
        }

        function goToHome() {
            currentScreen = 'home';
            render();
        }

        function triggerAnalysis(type) {
            scanResultType = type;
            currentScreen = 'analyzing';
            render();
            setTimeout(() => {
                currentScreen = 'result';
                render();
            }, 1200);
        }

        function switchTab(tab) {
            if (tab === 'home') currentScreen = 'home';
            if (tab === 'history') currentScreen = 'history';
            if (tab === 'settings') currentScreen = 'settings';
            render();
        }

        function updateNavActive() {
            document.getElementById('nav-home').className = `flex flex-col items-center space-y-1 ${activeTab==='home'?'text-blue-400 font-semibold':'text-slate-400'}`;
            document.getElementById('nav-history').className = `flex flex-col items-center space-y-1 ${activeTab==='history'?'text-blue-400 font-semibold':'text-slate-400'}`;
            document.getElementById('nav-settings').className = `flex flex-col items-center space-y-1 ${activeTab==='settings'?'text-blue-400 font-semibold':'text-slate-400'}`;
        }

        render();
    </script>
</body>
</html>
